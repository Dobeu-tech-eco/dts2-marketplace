name: test

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ github.event_name == 'pull_request' && fromJSON('["3.12"]') || fromJSON('["3.10","3.11","3.12","3.13"]') }}
    defaults:
      run:
        working-directory: plugins/dts2-harness
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: plugins/dts2-harness/requirements-dev.txt
      - name: Install dev requirements
        run: python3 -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python3 -m pytest -n auto -q tests

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install linters
        run: pip install ruff==0.16.9 shellcheck-py==0.10.0.1
      - name: Ruff
        run: ruff check plugins/dts2-harness
      - name: Shellcheck
        run: shellcheck -x plugins/dts2-harness/hooks/*.sh
      - name: Shellcheck the installer
        run: shellcheck -x install.sh

  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Context tax (always-loaded skill and agent metadata, chars/4 estimate)
        run: python3 plugins/dts2-harness/scripts/context-tax.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install the Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.311
      - name: Validate the plugin (skipped when the CLI is absent)
        run: |
          if command -v claude >/dev/null 2>&1; then
            claude plugin validate plugins/dts2-harness --strict
          else
            echo "claude CLI not found; skipping plugin validation"
          fi
