name: test

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ github.event_name == 'pull_request' && fromJSON('["3.12"]') || fromJSON('["3.10","3.11","3.12","3.13"]') }}
    defaults:
      run:
        working-directory: plugins/dts2-runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: plugins/dts2-runtime/requirements-dev.txt
      - name: Install dev requirements
        run: python3 -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python3 -m pytest -n auto -q tests

  portable:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    defaults:
      run:
        working-directory: plugins/dts2-runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: plugins/dts2-runtime/requirements-dev.txt
      - name: Install dev requirements
        shell: bash
        run: python -m pip install -r requirements-dev.txt
      - name: Portable tests
        shell: bash
        run: python -m pytest -q tests/test_portable.py tests/test_doctor_platforms.py tests/test_roadmap_lock.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install linters
        run: pip install ruff==0.16.9 shellcheck-py==0.10.0.1
      - name: Ruff
        run: ruff check plugins/dts2-runtime
      - name: Shellcheck
        run: shellcheck -x plugins/dts2-runtime/hooks/*.sh
      - name: Shellcheck the installer
        run: shellcheck -x install.sh

  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Release gate (runtime change into main needs a plugin.json version bump)
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: python3 plugins/dts2-runtime/scripts/release-gate.py --base "origin/${{ github.base_ref }}"
      - name: Context tax (always-loaded skill and agent metadata, chars/4 estimate)
        run: python3 plugins/dts2-runtime/scripts/context-tax.py
      - name: Directory edition matches the generator
        run: python3 plugins/dts2-runtime/scripts/directory_edition.py --check
      - name: Cursor surface matches the generator
        run: python3 plugins/dts2-runtime/scripts/cursor_surface.py --check
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install the Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.311
      - name: Validate the plugin (skipped when the CLI is absent)
        run: |
          if command -v claude >/dev/null 2>&1; then
            claude plugin validate plugins/dts2-runtime --strict
            claude plugin validate plugins/dts2-harness --strict
          else
            echo "claude CLI not found; skipping plugin validation"
          fi
