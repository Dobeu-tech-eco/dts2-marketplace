name: test

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: plugins/dts2-harness
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: python3 -m unittest discover -s tests

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install linters
        run: pip install ruff==0.16.9 shellcheck-py==0.10.0.1
      - name: Ruff
        run: ruff check plugins/dts2-harness
      - name: Shellcheck
        run: shellcheck -x plugins/dts2-harness/hooks/*.sh

  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Context tax (always-loaded skill and agent metadata, chars/4 estimate)
        run: python3 plugins/dts2-harness/scripts/context-tax.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.318
      - name: Validate the plugin
        run: claude plugin validate plugins/dts2-harness --strict
