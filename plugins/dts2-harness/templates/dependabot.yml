# Generated by dts2-harness setup. One `updates` entry per package manifest found in the repo.
# Replace each __PLACEHOLDER__ before committing; repeat the first entry for every ecosystem and directory.
# Ecosystem names: npm, pip, cargo, gomod, bundler, composer, docker, github-actions.
version: 2
updates:
  - package-ecosystem: "__ECOSYSTEM__"
    directory: "__DIRECTORY__"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
